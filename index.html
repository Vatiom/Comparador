@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
.oc-root {
  --ambar:#E19E07; --pizarra:#2A3A4A; --lavanda:#676FA3;
  --fondo:#EEEFF3; --fondo-prof:#DEE0E8; --blanco:#FFFFFF;
  --piz-500:#6E7782; --exito:#2D6A4F; --error:#8B2434;
  --borde:rgba(42,58,74,.10);
  background:var(--fondo); color:var(--pizarra);
  font-family:'Montserrat',system-ui,sans-serif;
  min-height:100vh; padding:32px 20px; max-width:960px; margin:0 auto;
}
.oc-header{display:flex; align-items:center; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
.oc-logo{height:44px; width:auto; object-fit:contain;}
.oc-h1{font-size:30px; font-weight:600; letter-spacing:-0.01em; margin:0; line-height:1.2;}
.oc-sub{font-size:15px; color:var(--piz-500); margin:4px 0 0;}
.oc-demo{color:var(--lavanda); font-weight:600;}
.oc-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px;
  padding:24px; box-shadow:0 1px 2px rgba(42,58,74,.04); margin-bottom:20px;}
.oc-grupo{margin-bottom:18px; flex:1; min-width:150px;}
.oc-fila{display:flex; gap:16px; flex-wrap:wrap;}
.oc-label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;
  text-transform:uppercase; letter-spacing:.04em; color:var(--piz-500);}
.oc-input{width:100%; box-sizing:border-box; font-family:inherit; font-size:16px;
  padding:11px 12px; border:1.5px solid var(--fondo-prof); border-radius:10px;
  background:var(--fondo); color:var(--pizarra); outline:none;}
.oc-input:focus{border-color:var(--lavanda);}
.oc-dato{font-size:22px; font-weight:700; padding:8px 0;}
.oc-toggle{display:flex; gap:8px; flex-wrap:wrap;}
.oc-toggle-mini .oc-toggle-btn{padding:8px 14px; font-size:13px; min-width:0;}
.oc-toggle-btn{flex:1; min-width:90px; font-family:inherit; font-size:15px; font-weight:600;
  padding:11px 12px; border-radius:10px; border:1.5px solid var(--fondo-prof);
  background:var(--fondo); color:var(--piz-500); cursor:pointer;}
.oc-toggle-btn.activo{background:var(--pizarra); color:var(--fondo); border-color:var(--pizarra);}
.oc-periodos{display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr)); gap:10px;}
.oc-periodo{display:flex; flex-direction:column; gap:4px;}
.oc-periodo-tag{font-size:12px; font-weight:700; color:var(--lavanda);}
.oc-btn{width:100%; font-family:inherit; font-size:16px; font-weight:600;
  background:var(--ambar); color:var(--pizarra); border:none; border-radius:10px;
  padding:14px 28px; cursor:pointer; transition:filter .15s ease;}
.oc-btn:hover:not(:disabled){filter:brightness(.95);}
.oc-btn:disabled{opacity:.45; cursor:not-allowed;}
.oc-btn-pdf{margin-top:16px;}
.oc-caption{font-size:13px; color:var(--piz-500); margin:2px 0 14px;}
.oc-caption-inline{margin:6px 0 0;}
.oc-error{color:var(--error); font-size:14px; font-weight:600; margin:8px 0 0;}
.oc-res-cab{display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.oc-h2{font-size:22px; font-weight:600; margin:0;}
.oc-h3{font-size:15px; font-weight:600; margin:18px 0 8px;}
.oc-total{font-size:28px; font-weight:700; color:var(--ambar);}
.oc-scroll{overflow-x:auto;}
.oc-tabla{width:100%; border-collapse:collapse; font-size:15px;}
.oc-tabla td{padding:7px 6px 7px 0; border-bottom:1px solid var(--fondo-prof);}
.oc-tabla td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
.oc-tabla-total td{font-weight:700; border-bottom:2px solid var(--pizarra);}
.oc-tabla-detalle{font-size:14px;}
.oc-tabla-detalle th{font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--piz-500); text-align:left; font-weight:600; padding:0 6px 6px 0;
  border-bottom:1px solid var(--fondo-prof);}
.oc-tabla-detalle th:last-child{text-align:right;}
.oc-tabla-detalle th,.oc-tabla-detalle td{text-align:right;}
.oc-tabla-detalle th:first-child,.oc-tabla-detalle td:first-child{text-align:left;}
.oc-tabla-detalle td{padding-right:0;}
.oc-tabla-detalle td{font-variant-numeric:tabular-nums;}
.oc-tabla-sub td{font-weight:700;}
.oc-ranking{white-space:nowrap;}
.oc-ranking .oc-fila-rank{cursor:pointer;}
.oc-ranking .oc-fila-rank:hover td{background:var(--fondo);}
.oc-ranking .oc-fila-rank.sel td{background:var(--fondo-prof); font-weight:600;}
.oc-pos{color:var(--exito); font-weight:600;}
.oc-neg{color:var(--error); font-weight:600;}
.oc-ahorro{margin-top:16px; border-radius:12px; padding:16px 18px; text-align:center;}
.oc-ahorro.positivo{background:var(--pizarra); color:var(--fondo);}
.oc-ahorro.negativo{background:var(--fondo-prof); color:var(--pizarra);}
.oc-ahorro-cifra{font-size:20px; font-weight:700;}
.oc-ahorro.positivo .oc-ahorro-cifra{color:var(--ambar);}
.oc-ahorro-anual{font-size:14px; margin-top:4px; opacity:.85;}
.oc-comision{margin-top:14px; border:1.5px dashed var(--lavanda); border-radius:12px;
  padding:12px 16px; background:var(--fondo);}
.oc-comision-tag{font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--lavanda); margin-bottom:4px;}
.oc-comision-linea{font-size:15px;}

.oc-print{display:none;}
.oc-print{display:none; color:#2A3A4A; font-family:'Montserrat',system-ui,sans-serif; font-size:12px; padding:14px 20px; width:794px; box-sizing:border-box; background:#FFFFFF; position:relative;}

.oc-print-tabla th:last-child{text-align:right;}
.oc-print-tabla td{padding:3px 0; border-bottom:1px solid #EEEFF3;}
.oc-print-tabla td:last-child{text-align:right;}
.oc-print-tabla th,.oc-print-tabla td{text-align:right;}
.oc-print-tabla th:first-child,.oc-print-tabla td:first-child{text-align:left;}
.oc-print-sub td{font-weight:700; border-bottom:2px solid #2A3A4A;}
.oc-print-ahorro{margin-top:10px; background:#2A3A4A; color:#EEEFF3; border-radius:8px; padding:9px 16px; text-align:center; font-size:14px; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
.oc-print-ahorro strong{color:#E19E07;}
.oc-print-pie{margin-top:12px; font-size:9px; color:#6E7782; line-height:1.4;}
